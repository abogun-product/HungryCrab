repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
        args: [--markdown-linebreak-ext=md]
  # Use the exact Ruff resolved by uv.lock, avoiding a second drifting tool pin.
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check (uv.lock)
        entry: uv run --locked ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        exclude: ^tests/fixtures/
      - id: ruff-format
        name: Ruff format (uv.lock)
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        exclude: ^tests/fixtures/
